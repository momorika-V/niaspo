# Roundcube Webmail Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: roundcube
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: roundcube
  template:
    metadata:
      labels:
        app: roundcube
    spec:
      containers:
        - name: roundcube
          image: roundcube/roundcubemail:latest
          ports:
            - containerPort: 80
          env:
            - name: ROUNDCUBEMAIL_DB_TYPE
              value: pgsql
            - name: ROUNDCUBEMAIL_DB_HOST
              value: postgres
            - name: ROUNDCUBEMAIL_DB_PORT
              value: "5432"
            - name: ROUNDCUBEMAIL_DB_NAME
              value: roundcube
            - name: ROUNDCUBEMAIL_DB_USER
              value: roundcube
            - name: ROUNDCUBEMAIL_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mail-secrets
                  key: POSTGRES_PASSWORD
            - name: ROUNDCUBEMAIL_DEFAULT_HOST
              value: mailserver
            - name: ROUNDCUBEMAIL_DEFAULT_PORT
              value: "143"
            - name: ROUNDCUBEMAIL_SMTP_SERVER
              value: tls://mailserver
            - name: ROUNDCUBEMAIL_SMTP_PORT
              value: "587"
            - name: ROUNDCUBEMAIL_SMTP_USER
              value: "%u"
            - name: ROUNDCUBEMAIL_SMTP_PASS
              value: "%p"
            - name: ROUNDCUBEMAIL_SMTP_AUTH_TYPE
              value: PLAIN
            - name: ROUNDCUBEMAIL_DES_KEY
              valueFrom:
                secretKeyRef:
                  name: mail-secrets
                  key: ROUNDCUBE_DES_KEY
            - name: ROUNDCUBEMAIL_REQUEST_PATH
              value: /roundcube/
---
# Internal Roundcube Service
apiVersion: v1
kind: Service
metadata:
  name: roundcube
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: roundcube
  ports:
    - port: 80
      targetPort: 80
